name: Deploy NextGuide documentation to Pages
on:
  push:
    branches: [web]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "*.json"
      - "*.mjs"
      - "bun.lock"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Check NextGuide repository access
        env:
          NEXTGUIDE_READ_TOKEN: ${{ secrets.NEXTGUIDE_READ_TOKEN }}
        run: |
          if [ -z "$NEXTGUIDE_READ_TOKEN" ]; then
            echo "::error::Configure a read-only NEXTGUIDE_READ_TOKEN repository secret for the private NextGuide source."
            exit 1
          fi
      - name: Check out pinned NextGuide source
        uses: actions/checkout@v4
        with:
          repository: m1nsook/NextGuide
          ref: b5240cad0d9880f98b56bd4f27e8c8d772264d40
          token: ${{ secrets.NEXTGUIDE_READ_TOKEN }}
          path: .nextguide-source
          persist-credentials: false
      - name: Build local NextGuide package and install
        env:
          NEXTGUIDE_SOURCE: ${{ github.workspace }}/.nextguide-source
        run: bun run setup
      - name: Validate API and static Pages export
        run: bun run check
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
