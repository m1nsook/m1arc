name: Deploy NextGuide documentation to Pages
on:
  push:
    branches: [web]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify bundled NextGuide package
        working-directory: apps/web
        run: node scripts/check-nextguide.mjs
      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Validate API and static Pages export
        working-directory: apps/web
        env:
          M1ARC_PAGES: "1"
        run: bun run check:export
      - run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out/
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
