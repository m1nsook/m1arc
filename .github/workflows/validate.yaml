name: Validate NextGuide documentation
on:
  pull_request:
    branches: [web]
permissions:
  contents: read
concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Check NextGuide repository access
        env:
          NEXTGUIDE_READ_TOKEN: ${{ secrets.NEXTGUIDE_READ_TOKEN }}
        run: |
          if [ -z "$NEXTGUIDE_READ_TOKEN" ]; then
            echo "::error::Configure a read-only NEXTGUIDE_READ_TOKEN repository secret for the private NextGuide source."
            exit 1
          fi
      - name: Check out pinned NextGuide source
        uses: actions/checkout@v4
        with:
          repository: m1nsook/NextGuide
          ref: b5240cad0d9880f98b56bd4f27e8c8d772264d40
          token: ${{ secrets.NEXTGUIDE_READ_TOKEN }}
          path: .nextguide-source
          persist-credentials: false
      - name: Build local NextGuide package and install
        env:
          NEXTGUIDE_SOURCE: ${{ github.workspace }}/.nextguide-source
        run: bun run setup
      - name: Validate API and static Pages export
        run: bun run check
      - run: touch out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: m1arc-nextguide-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
