name: Validate NextGuide documentation
on:
  pull_request:
    branches: [web]
permissions:
  contents: read
concurrency:
  group: docs-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Build pinned NextGuide package and install
        run: bun run setup
      - name: Validate API and static Pages export
        run: bun run check
      - run: touch out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: m1arc-nextguide-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
