name: M1 Arc native build

on:
  push:
    branches: [native]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "r6/**"
      - "README.md"
      - "scripts/**"
      - ".github/workflows/native.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "r6/**"
      - "README.md"
      - "scripts/**"
      - "locales/**"
      - ".github/workflows/native.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure native RED4ext x64 DLL
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DM1ARC_ENABLE_DEV_PREVIEW=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build native DLL and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native M1 Arc build failed" }
      - name: Run native settings and persistence tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Check M1 Arc REDscript declarations with pinned upstream CLI
        shell: pwsh
        env:
          REDSCRIPT_GAME_BUNDLE_URL: ${{ secrets.REDSCRIPT_GAME_BUNDLE_URL }}
          REDSCRIPT_GAME_BUNDLE_SHA256: ${{ secrets.REDSCRIPT_GAME_BUNDLE_SHA256 }}
        run: |
          ./scripts/check_redscript_cli.ps1 -SourceRoots @("r6/scripts/m1arc")
          if ($LASTEXITCODE -ne 0) { throw "REDscript CLI checks failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Karla font instancer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "fonttools==4.60.1"
          if ($LASTEXITCODE -ne 0) { throw "FontTools installation failed" }
      - name: Package single game-root ZIP layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "package/red4ext/plugins/m1arc"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "build/Release/m1arc.dll" "$dst/m1arc.dll"
          Copy-Item LICENSE "$dst/LICENSE"
          # Clean test build: no demo marker or compiled demo registration.
          if (Test-Path "$dst/dev-preview.enabled") { Remove-Item "$dst/dev-preview.enabled" -Force }
          # Pinned OFL/MIT assets. Do not include proprietary user-supplied Blender Pro.
          $fonts = Join-Path $dst "fonts"
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null
          $karla = "06bfe0d62a98375cb09c942fa18e68bd32cff057"
          $phosphor = "3d40a3eaa73b25d20d263f0e1e55c9fed3e66809"
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/karla/Karla%5Bwght%5D.ttf" -OutFile "$fonts/Karla-Variable.ttf"
          python scripts/instantiate_karla.py "$fonts/Karla-Variable.ttf" "$fonts"
          if ($LASTEXITCODE -ne 0) { throw "Karla fixed-weight generation failed" }
          Remove-Item "$fonts/Karla-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/karla/OFL.txt" -OutFile "$fonts/Karla-OFL.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/ChakraPetch-SemiBold.ttf" -OutFile "$fonts/ChakraPetch-SemiBold.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/ChakraPetch-Bold.ttf" -OutFile "$fonts/ChakraPetch-Bold.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/OFL.txt" -OutFile "$fonts/ChakraPetch-OFL.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/phosphor-icons/web/$phosphor/src/regular/Phosphor.ttf" -OutFile "$fonts/Phosphor-Regular.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/phosphor-icons/web/$phosphor/LICENSE" -OutFile "$fonts/Phosphor-MIT.txt"
          # Static JetBrains Mono, for diagnostics only. Use the same pinned OFL source.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" -OutFile "$fonts/JetBrainsMono-Variable.ttf"
          python scripts/instantiate_mono.py "$fonts/JetBrainsMono-Variable.ttf" "$fonts/JetBrainsMono-Regular.ttf"
          if ($LASTEXITCODE -ne 0) { throw "JetBrains Mono generation failed" }
          Remove-Item "$fonts/JetBrainsMono-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/jetbrainsmono/OFL.txt" -OutFile "$fonts/JetBrainsMono-OFL.txt"
          # Static OFL Hangul font: subset from pinned Google Fonts source.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -OutFile "$fonts/NotoSansKR-Variable.ttf"
          python scripts/subset_korean.py "$fonts/NotoSansKR-Variable.ttf" "$fonts/NotoSansKR-Hangul.ttf"
          if ($LASTEXITCODE -ne 0) { throw "Korean font generation failed" }
          Remove-Item "$fonts/NotoSansKR-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/notosanskr/OFL.txt" -OutFile "$fonts/NotoSansKR-OFL.txt"
          foreach ($font in @("Karla-Medium.ttf", "Karla-SemiBold.ttf", "Karla-Bold.ttf", "ChakraPetch-SemiBold.ttf", "ChakraPetch-Bold.ttf", "Phosphor-Regular.ttf", "NotoSansKR-Hangul.ttf", "JetBrainsMono-Regular.ttf")) {
            if ((Get-Item "$fonts/$font").Length -lt 10000) { throw "Invalid or missing font asset: $font" }
          }
          Copy-Item "locales" "$dst/locales" -Recurse -Force
          foreach ($lang in @("en_US", "pl_PL", "ko_KR")) {
            if (!(Test-Path "$dst/locales/$lang.json")) { throw "Missing bundled locale: $lang" }
          }
          $apiPath = "package/r6/scripts/m1arc"
          New-Item -ItemType Directory -Path $apiPath -Force | Out-Null
          Copy-Item "r6/scripts/m1arc/M1Arc.reds" "$apiPath/M1Arc.reds"
          if (!(Test-Path "$apiPath/M1Arc.reds")) { throw "REDscript native API declarations missing" }
          if (!(Test-Path "$dst/m1arc.dll")) { throw "DLL missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: m1arc-native-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
