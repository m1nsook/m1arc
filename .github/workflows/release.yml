name: Build M1 Arc Release

# Manually invoked from Actions -> Build M1 Arc Release -> Run workflow.
# Manual runs publish by default; uncheck publish for a draft test build.
# No automatic release on branch pushes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (1.0.0 or v1.0.0; optional -dev.1)"
        required: true
        type: string
      publish:
        description: "Publish release (uncheck only for draft testing)"
        required: true
        type: boolean
        default: true
      ui_test:
        description: "Also build a UI Test ZIP for toasts and sidebar (draft only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: m1arc-manual-release
  cancel-in-progress: false

jobs:
  windows-release:
    if: github.repository == 'm1nsook/m1arc' && github.ref == 'refs/heads/main'
    name: Build M1 Arc ${{ inputs.version }}
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
      INCLUDE_UI_TEST: ${{ inputs.ui_test }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp requested release version into this build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawVersion = $env:RELEASE_VERSION.Trim()
          $vm = [regex]::Match($rawVersion, '^v?([0-9]+\.[0-9]+\.[0-9]+)(-[a-z0-9]+\.[0-9]+)?$')
          if (-not $vm.Success) { throw "Use version 1.0.0 or 1.0.0-dev.1" }
          $numeric = $vm.Groups[1].Value
          $version = $numeric + $vm.Groups[2].Value
          $parts = $numeric.Split(".")
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          function Stamp($file,$pattern,$value) {
            $src = [IO.File]::ReadAllText((Resolve-Path $file))
            if ([regex]::Matches($src,$pattern).Count -ne 1) {
              throw "Version anchor missing or repeated in $file"
            }
            $src = [regex]::Replace($src,$pattern,$value)
            [IO.File]::WriteAllText((Resolve-Path $file),$src,[Text.UTF8Encoding]::new($false))
          }
          Stamp "CMakeLists.txt" `
            'project\(M1Arc VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES CXX\)' `
            "project(M1Arc VERSION $numeric LANGUAGES CXX)"
          Stamp "src/plugin.cpp" `
            'CString\("[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9]+\.[0-9]+)?"\)' `
            ('CString("' + $version + '")')
          Stamp "src/plugin.cpp" `
            'RED4EXT_V1_SEMVER\([0-9]+,\s*[0-9]+,\s*[0-9]+\)' `
            "RED4EXT_V1_SEMVER($major,$minor,$patch)"
          Stamp "src/mod_manifest.cpp" `
            'kM1ArcVersion\{[0-9]+,\s*[0-9]+,\s*[0-9]+\}' `
            "kM1ArcVersion{$major, $minor, $patch}"
          Write-Host "Release C++ and manifest version: $version"
      - name: Configure native RED4ext x64 DLL
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DM1ARC_ENABLE_DEV_PREVIEW=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
      - name: Build native DLL and tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Native M1 Arc build failed" }
      - name: Run native settings and persistence tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }
      - name: Check M1 Arc REDscript declarations with pinned upstream CLI
        shell: pwsh
        env:
          REDSCRIPT_GAME_BUNDLE_URL: ${{ secrets.REDSCRIPT_GAME_BUNDLE_URL }}
          REDSCRIPT_GAME_BUNDLE_SHA256: ${{ secrets.REDSCRIPT_GAME_BUNDLE_SHA256 }}
        run: |
          ./scripts/check_redscript_cli.ps1 -SourceRoots @("r6/scripts/m1arc")
          if ($LASTEXITCODE -ne 0) { throw "REDscript CLI checks failed" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Karla font instancer
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "fonttools==4.60.1"
          if ($LASTEXITCODE -ne 0) { throw "FontTools installation failed" }
      - name: Package single game-root ZIP layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "package/red4ext/plugins/m1arc"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "build/Release/m1arc.dll" "$dst/m1arc.dll"
          Copy-Item LICENSE "$dst/LICENSE"
          # Release ZIPs must omit the temporary dev-preview.enabled marker.
          # Pinned OFL/MIT assets. Do not include proprietary user-supplied Blender Pro.
          $fonts = Join-Path $dst "fonts"
          New-Item -ItemType Directory -Path $fonts -Force | Out-Null
          $karla = "06bfe0d62a98375cb09c942fa18e68bd32cff057"
          $phosphor = "3d40a3eaa73b25d20d263f0e1e55c9fed3e66809"
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/karla/Karla%5Bwght%5D.ttf" -OutFile "$fonts/Karla-Variable.ttf"
          python scripts/instantiate_karla.py "$fonts/Karla-Variable.ttf" "$fonts"
          if ($LASTEXITCODE -ne 0) { throw "Karla fixed-weight generation failed" }
          Remove-Item "$fonts/Karla-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/karla/OFL.txt" -OutFile "$fonts/Karla-OFL.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/ChakraPetch-SemiBold.ttf" -OutFile "$fonts/ChakraPetch-SemiBold.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/ChakraPetch-Bold.ttf" -OutFile "$fonts/ChakraPetch-Bold.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/chakrapetch/OFL.txt" -OutFile "$fonts/ChakraPetch-OFL.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/phosphor-icons/web/$phosphor/src/regular/Phosphor.ttf" -OutFile "$fonts/Phosphor-Regular.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/phosphor-icons/web/$phosphor/LICENSE" -OutFile "$fonts/Phosphor-MIT.txt"
          # Static JetBrains Mono, for diagnostics only. Use the same pinned OFL source.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" -OutFile "$fonts/JetBrainsMono-Variable.ttf"
          python scripts/instantiate_mono.py "$fonts/JetBrainsMono-Variable.ttf" "$fonts/JetBrainsMono-Regular.ttf"
          if ($LASTEXITCODE -ne 0) { throw "JetBrains Mono generation failed" }
          Remove-Item "$fonts/JetBrainsMono-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/jetbrainsmono/OFL.txt" -OutFile "$fonts/JetBrainsMono-OFL.txt"
          # Static OFL Hangul font: subset from pinned Google Fonts source.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -OutFile "$fonts/NotoSansKR-Variable.ttf"
          python scripts/subset_korean.py "$fonts/NotoSansKR-Variable.ttf" "$fonts/NotoSansKR-Hangul.ttf"
          if ($LASTEXITCODE -ne 0) { throw "Korean font generation failed" }
          Remove-Item "$fonts/NotoSansKR-Variable.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/$karla/ofl/notosanskr/OFL.txt" -OutFile "$fonts/NotoSansKR-OFL.txt"
          foreach ($font in @("Karla-Medium.ttf", "Karla-SemiBold.ttf", "Karla-Bold.ttf", "ChakraPetch-SemiBold.ttf", "ChakraPetch-Bold.ttf", "Phosphor-Regular.ttf", "NotoSansKR-Hangul.ttf", "JetBrainsMono-Regular.ttf")) {
            if ((Get-Item "$fonts/$font").Length -lt 10000) { throw "Invalid or missing font asset: $font" }
          }
          Copy-Item "locales" "$dst/locales" -Recurse -Force
          foreach ($lang in @("en_US", "pl_PL", "ko_KR")) {
            if (!(Test-Path "$dst/locales/$lang.json")) { throw "Missing bundled locale: $lang" }
          }
          $apiPath = "package/r6/scripts/m1arc"
          New-Item -ItemType Directory -Path $apiPath -Force | Out-Null
          Copy-Item "r6/scripts/m1arc/M1Arc.reds" "$apiPath/M1Arc.reds"
          if (!(Test-Path "$apiPath/M1Arc.reds")) { throw "REDscript native API declarations missing" }
          if (!(Test-Path "$dst/m1arc.dll")) { throw "DLL missing" }
      - name: Build installable ZIPs and SHA-256 hashes
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inputVersion = $env:RELEASE_VERSION.Trim()
          $versionMatch = [regex]::Match(
            $inputVersion, '^v?([0-9]+\.[0-9]+\.[0-9]+)(-[a-z0-9]+\.[0-9]+)?$'
          )
          if (-not $versionMatch.Success) {
            throw "Invalid version: use 1.0.0, v1.0.0, or 1.0.0-dev.1"
          }
          $tag = "v" + $versionMatch.Groups[1].Value + $versionMatch.Groups[2].Value
          if (Test-Path "package/red4ext/plugins/m1arc/dev-preview.enabled") {
            throw "Clean release cannot enable the temporary UI Test mod"
          }
          if (Test-Path "package/red4ext/plugins/m1arc/mods") {
            throw "Release cannot bundle gameplay mods"
          }
          if (Get-ChildItem -Path package -Filter "*Blender*" -Recurse -File) {
            throw "Proprietary Blender Pro fonts must not be shipped"
          }
          $required = @(
            "package/red4ext/plugins/m1arc/m1arc.dll",
            "package/red4ext/plugins/m1arc/LICENSE",
            "package/r6/scripts/m1arc/M1Arc.reds",
            "package/red4ext/plugins/m1arc/fonts/Phosphor-Regular.ttf",
            "package/red4ext/plugins/m1arc/fonts/Karla-SemiBold.ttf",
            "package/red4ext/plugins/m1arc/fonts/ChakraPetch-SemiBold.ttf",
            "package/red4ext/plugins/m1arc/fonts/Karla-OFL.txt",
            "package/red4ext/plugins/m1arc/fonts/Phosphor-MIT.txt",
            "package/red4ext/plugins/m1arc/fonts/NotoSansKR-Hangul.ttf",
            "package/red4ext/plugins/m1arc/fonts/NotoSansKR-OFL.txt",
            "package/red4ext/plugins/m1arc/fonts/JetBrainsMono-Regular.ttf",
            "package/red4ext/plugins/m1arc/fonts/JetBrainsMono-OFL.txt",
            "package/red4ext/plugins/m1arc/locales/ko_KR.json"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required release file missing: $file" }
          }
          # First create the exact installation package without test fixtures.
          $cleanZip = "m1arc-$tag-game-root.zip"
          Compress-Archive -Path "package/*" -DestinationPath $cleanZip -CompressionLevel Optimal
          if ((Get-Item $cleanZip).Length -lt 25000) { throw "Clean ZIP unexpectedly small" }
          $sums = @(
            "$((Get-FileHash -Algorithm SHA256 $cleanZip).Hash.ToLowerInvariant())  $cleanZip"
          )
          $previewZip = ""
          # A separate, explicit development ZIP enables the existing UI
          # fixture so the player can check toasts, sidebar icons and labels.
          # Never include the marker in a publicly published release.
          if ($env:PUBLISH_RELEASE -ne "true" -and $env:INCLUDE_UI_TEST -eq "true") {
            $marker = "package/red4ext/plugins/m1arc/dev-preview.enabled"
            try {
              # Build a separate demo DLL; the clean ZIP above always uses the production DLL.
              cmake -S . -B build -DM1ARC_ENABLE_DEV_PREVIEW=ON
              if ($LASTEXITCODE -ne 0) { throw "UI Test configure failed" }
              cmake --build build --config Release --parallel 4 --target m1arc
              if ($LASTEXITCODE -ne 0) { throw "UI Test build failed" }
              Copy-Item "build/Release/m1arc.dll" "package/red4ext/plugins/m1arc/m1arc.dll" -Force
              Set-Content -Path $marker -Value "M1 Arc UI Test fixture (development only)" -Encoding ascii
              $previewZip = "m1arc-$tag-ui-test-game-root.zip"
              Compress-Archive -Path "package/*" -DestinationPath $previewZip -CompressionLevel Optimal
              if ((Get-Item $previewZip).Length -lt 25000) { throw "UI Test ZIP unexpectedly small" }
              $sums += "$((Get-FileHash -Algorithm SHA256 $previewZip).Hash.ToLowerInvariant())  $previewZip"
            } finally {
              if (Test-Path $marker) { Remove-Item $marker }
            }
          }
          $checksumFile = "m1arc-$tag-SHA256.txt"
          $sums | Set-Content -Path $checksumFile -Encoding ascii
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_zip=$cleanZip" >> $env:GITHUB_OUTPUT
          "preview_zip=$previewZip" >> $env:GITHUB_OUTPUT
          "release_sha=$checksumFile" >> $env:GITHUB_OUTPUT
      - name: Verify both ZIP layouts and UI Test marker isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          $cleanZip = "${{ steps.package.outputs.release_zip }}"
          $uiTestZip = "${{ steps.package.outputs.preview_zip }}"
          function AssertPackage($zipPath, [bool]$expectUiTest) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))
            try {
              $paths = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\","/") })
              if ("red4ext/plugins/m1arc/m1arc.dll" -notin $paths) { throw "Missing root DLL: $zipPath" }
              if ("r6/scripts/m1arc/M1Arc.reds" -notin $paths) { throw "Missing REDscript API: $zipPath" }
              if (@($paths | Where-Object { $_ -like "package/*" }).Count -gt 0) {
                throw "Nested package folder: $zipPath"
              }
              if (@($paths | Where-Object { $_ -like "*Blender*" }).Count -gt 0) {
                throw "Proprietary font in release: $zipPath"
              }
              $marker = "red4ext/plugins/m1arc/dev-preview.enabled" -in $paths
              if ($marker -ne $expectUiTest) { throw "Incorrect UI Test marker: $zipPath" }
            } finally { $archive.Dispose() }
          }
          AssertPackage $cleanZip $false
          if ($uiTestZip) { AssertPackage $uiTestZip $true }
      - name: Create draft or publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.package.outputs.release_tag }}"
          $existingTags = gh release list --limit 100 --json tagName --jq ".[].tagName"
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect existing releases" }
          if (@($existingTags) -contains $tag) {
            throw "Release $tag already exists. Enter a new version."
          }
          $draft = $env:PUBLISH_RELEASE -ne "true"
          $notes = @'
          ## M1 Arc {tag}

          Native RED4ext settings module for Cyberpunk 2077 2.50.

          **Requirements:** RED4ext and REDscript.

          **Install:** extract the contents of `m1arc-{tag}-game-root.zip`
          into the Cyberpunk 2077 game folder (the directory containing
          `r6` and `red4ext`). Close the game before installing or updating.

          The normal ZIP does not include the temporary UI Test.
          A separate `-ui-test-game-root.zip` is attached to draft builds
          when enabled, and displays sample settings for visual testing.
          After testing, install the normal ZIP and remove
          `red4ext/plugins/m1arc/dev-preview.enabled` if present.

          [Documentation](https://m1nsook.github.io/m1arc/)
          · [Nexus Mods](https://www.nexusmods.com/cyberpunk2077/mods/39311)
          '@
          $notes.Replace("{tag}", $tag) | Set-Content -Path release-notes.md -Encoding utf8
          # Prefer reviewed version-specific notes when present.
          if (Test-Path ".github/releases/$tag.md") {
            Copy-Item ".github/releases/$tag.md" "release-notes.md" -Force
          }
          $files = @(
            "${{ steps.package.outputs.release_zip }}",
            "${{ steps.package.outputs.release_sha }}"
          )
          if ($draft -and "${{ steps.package.outputs.preview_zip }}") {
            $files += "${{ steps.package.outputs.preview_zip }}"
          }
          $arguments = @("release", "create", $tag) + $files + @(
            "--target", $env:GITHUB_SHA, "--title", "M1 Arc $tag",
            "--notes-file", "release-notes.md"
          )
          if ($draft) { $arguments += "--draft" }
          if ($tag.Contains("-")) { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release $tag" }
      - uses: actions/upload-artifact@v4
        with:
          name: m1arc-${{ steps.package.outputs.release_tag }}-installers
          path: |
            ${{ steps.package.outputs.release_zip }}
            ${{ steps.package.outputs.release_sha }}
            ${{ steps.package.outputs.preview_zip }}
          if-no-files-found: error
          retention-days: 30

